name: Validar manifiestos

# Valida contra los esquemas de Kubernetes sin necesitar ningun cluster.

on:
  pull_request:
    paths:
      - "qa/**"
      - "production/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: kubeconform
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sfL -o kubeconform-linux-amd64.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform-linux-amd64.tar.gz" | sha256sum -c -
          tar xzf kubeconform-linux-amd64.tar.gz kubeconform
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/kubeconform" -strict -summary -ignore-missing-schemas -kubernetes-version 1.35.0 production qa

      - name: Ningun Secret en el repositorio
        run: |
          if grep -rnE '^kind: *Secret *$' production qa; then
            echo "::error::Los Secrets no van en este repositorio (es publico)."
            exit 1
          fi
