name: Validar manifiestos

# Reemplaza al job validate-manifests de GitLab CI.
# Requiere que el cluster de QA este encendido (igual que en GitLab): el
# dry-run necesita hablar con el API server para resolver los tipos.

on:
  pull_request:
    paths:
      - "qa/**"
      - "production/**"
      - ".github/workflows/**"

permissions:
  id-token: write
  contents: read

jobs:
  validar:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Login en Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Credenciales de aks-buses-dev
        uses: azure/aks-set-context@v4
        with:
          resource-group: rg-buses-jalapa
          cluster-name: aks-buses-dev

      # --validate=false: el dry-run=client de kubectl intenta descargar el
      # esquema OpenAPI del servidor para validar campos; sin esto la
      # negociacion falla. El dry-run ya valida sintaxis y estructura.
      - name: Dry-run de qa/ y production/
        run: |
          kubectl apply --dry-run=client --validate=false -f qa/
          kubectl apply --dry-run=client --validate=false -f production/
