name: Encender clusters (abre ventana 9pm GT)

# Reemplaza la mitad "start" del job clusters-schedule-toggle de GitLab CI.
# En GitLab era un solo job que decidia start/stop mirando `date -u +%H`,
# porque el proyecto no permitia variables por pipeline schedule. GitHub no
# tiene esa limitacion, asi que van dos workflows separados y explicitos.
#
# Guatemala es UTC-6 fijo (sin horario de verano): 9pm GT = 03:00 UTC
# del dia siguiente.
#
# Pero el cron dispara a las 02:35 UTC (8:35pm GT), 25 minutos ANTES de
# que abra la ventana, a proposito. El evento `schedule` de GitHub es de
# mejor esfuerzo: se retrasa cuando hay carga y a veces se descarta. La
# hora en punto es la franja mas congestionada, asi que ademas se corre
# al minuto 35. Con una ventana de solo 2 horas, un retraso de 40 min se
# come un tercio de la noche; adelantarlo cuesta ~1 USD al mes y compra
# ese margen. El cluster tarda unos minutos en quedar utilizable de todas
# formas, asi que el adelanto no se desperdicia.

on:
  schedule:
    - cron: "0 13 12 9 *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  encender:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        cluster: [aks-buses-dev, aks-buses-prod]
      fail-fast: false
    steps:
      - name: Login en Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Azure rechaza el start si todavia esta asentandose una operacion
      # previa de stop/start, aunque powerState ya diga lo contrario.
      - name: Encender ${{ matrix.cluster }}
        run: |
          set -euo pipefail
          estado=$(az aks show -n "${{ matrix.cluster }}" -g rg-buses-jalapa --query powerState.code -o tsv)
          if [ "$estado" = "Running" ]; then
            echo "${{ matrix.cluster }} ya esta encendido."
            exit 0
          fi
          for intento in 1 2 3 4 5; do
            if az aks start -n "${{ matrix.cluster }}" -g rg-buses-jalapa; then
              echo "Encendido en el intento $intento."
              exit 0
            fi
            echo "Intento $intento fallo (probablemente una operacion en curso), reintento en 30s..."
            sleep 30
          done
          echo "No se pudo encender ${{ matrix.cluster }} tras 5 intentos."
          exit 1
