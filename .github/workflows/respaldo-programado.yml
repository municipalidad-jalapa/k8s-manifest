name: Respaldo programado de Postgres

# Reemplaza a .scheduled_backup_template + scheduled-backup-qa/-production.
#
# SCRUM-163 (HU-68): "el respaldo se genera aunque el cluster haya estado
# apagado a la hora programada". El CronJob de Kubernetes NO corre con el
# cluster apagado y nadie recupera esa ejecucion despues; este workflow si
# corre siempre (vive fuera del cluster), lo prende si hace falta, dispara
# el Job a demanda, y lo vuelve a apagar solo si el fue quien lo prendio.

# Corre a las 04:10 UTC = 10:10pm GT, a proposito DENTRO de la ventana de
# operacion (9pm-11pm GT) y fuera de la hora en punto, que es cuando mas
# se retrasan los schedules de GitHub. Si corriera a la misma hora que el encendido,
# ambos pelearian por el `az aks start` y, peor, este workflow veria el
# cluster como "estaba apagado" y lo apagaria al terminar, matando la
# ventana. Corriendo adentro, lo encuentra encendido y no lo toca.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  respaldar:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - cluster: aks-buses-dev
            namespace: qa
          - cluster: aks-buses-prod
            namespace: production
      fail-fast: false
    steps:
      - name: Login en Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Encender ${{ matrix.cluster }} si esta apagado
        id: encendido
        run: |
          set -euo pipefail
          estado=$(az aks show -n "${{ matrix.cluster }}" -g rg-buses-jalapa --query powerState.code -o tsv)
          echo "Estado antes de respaldar: $estado"
          echo "estado_previo=$estado" >> "$GITHUB_OUTPUT"
          if [ "$estado" != "Running" ]; then
            for intento in 1 2 3 4 5; do
              if az aks start -n "${{ matrix.cluster }}" -g rg-buses-jalapa; then break; fi
              echo "Intento $intento fallo (operacion en curso), reintento en 30s..."
              sleep 30
            done
          fi

      - name: Credenciales del cluster
        run: az aks get-credentials -n "${{ matrix.cluster }}" -g rg-buses-jalapa --overwrite-existing

      - name: Esperar a que el API server responda
        run: |
          for i in $(seq 1 30); do
            if kubectl get ns >/dev/null 2>&1; then echo "API server listo."; exit 0; fi
            sleep 10
          done
          echo "El API server no respondio a tiempo."
          exit 1

      - name: Disparar el Job de respaldo
        run: |
          set -euo pipefail
          JOB="postgres-backup-programado-$(date +%s)"
          kubectl create job "$JOB" --from=cronjob/postgres-backup -n "${{ matrix.namespace }}"
          kubectl wait --for=condition=complete "job/$JOB" -n "${{ matrix.namespace }}" --timeout=300s
          kubectl logs "job/$JOB" -n "${{ matrix.namespace }}"

      - name: Volver a apagar si estaba apagado
        if: always() && steps.encendido.outputs.estado_previo != 'Running'
        run: |
          echo "El cluster estaba apagado antes: lo vuelvo a apagar."
          az aks stop -n "${{ matrix.cluster }}" -g rg-buses-jalapa --no-wait
