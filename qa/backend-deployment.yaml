apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api-buses
  namespace: qa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-api-buses
  template:
    metadata:
      labels:
        app: backend-api-buses
    spec:
      containers:
        - name: backend-api-buses
          image: acrbusesjalapa.azurecr.io/backend-api-buses:ca313ace
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: qa
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: ecoruta
            - name: DB_USER
              value: ecoruta
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: JWT_SECRET
            - name: ECORUTA_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: ECORUTA_ADMIN_TOKEN
            # SCRUM-309 (HU-137): origen https habilitado tras el TLS de QA.
            - name: CORS_ORIGENES
              value: "https://ecoruta-qa.tail47a5f7.ts.net"
            # SCRUM-310 (HU-138): credenciales del Admin SDK de Firebase. Los
            # nombres coinciden con ecoruta.firebase.credentials-json /
            # project-id (application.yml) para que el modulo de identidad
            # (SCRUM-158/HU-63, todavia sin mergear) funcione sin cambios
            # cuando se apruebe.
            - name: FIREBASE_CREDENTIALS_JSON
              valueFrom:
                secretKeyRef:
                  name: firebase-secret
                  key: FIREBASE_CREDENTIALS_JSON
            - name: FIREBASE_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: firebase-secret
                  key: FIREBASE_PROJECT_ID
            # HU Desarrollo-95 / ADR-002: en QA se necesita mas margen para
            # reservar sin estar fisicamente cerca de la parada.
            - name: DEMANDA_GEOCERCA_METROS
              value: "50000"
            # SCRUM-24: secreto de integracion que Traccar envia en X-Traccar-Token.
            # Vive en el Secret traccar-secret (lo crea desplegar-qa desde el
            # GitHub Secret TRACCAR_TOKEN); nunca se versiona en el repo.
            - name: TRACCAR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: traccar-secret
                  key: token
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api-buses
  namespace: qa
spec:
  selector:
    app: backend-api-buses
  ports:
    - port: 80
      targetPort: 8080