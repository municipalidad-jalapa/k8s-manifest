# ClusterIssuer de Let's Encrypt (produccion) para emitir certificados TLS
# automaticos por HTTP-01 a traves del ingress-nginx.
#
# Reemplaza el TLS que antes daba Tailscale Funnel: ahora el dominio propio
# (qa.mibusjalapa.lat) termina TLS en nginx con un certificado real de Let's
# Encrypt, renovado solo por cert-manager (ya instalado en el cluster).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: evantejadaduarte@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
