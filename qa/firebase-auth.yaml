# Inicio de sesión con Google bajo el dominio propio: qa.mibusjalapa.lat/__/auth/* -> mibus-jalapa-qa.firebaseapp.com
# El frontend se construye con VITE_FIREBASE_AUTH_DOMAIN=qa.mibusjalapa.lat y el cliente OAuth del proyecto mibus-jalapa-qa
# tiene autorizada https://qa.mibusjalapa.lat/__/auth/handler.
apiVersion: v1
kind: Service
metadata:
  name: firebase-auth
  namespace: qa
spec:
  type: ExternalName
  externalName: mibus-jalapa-qa.firebaseapp.com
  ports:
    - port: 443
      name: https
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: firebase-auth
  namespace: qa
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/upstream-vhost: mibus-jalapa-qa.firebaseapp.com
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-name: mibus-jalapa-qa.firebaseapp.com
spec:
  ingressClassName: nginx
  tls:
    - hosts: [qa.mibusjalapa.lat]
      secretName: qa-mibusjalapa-tls
  rules:
    - host: qa.mibusjalapa.lat
      http:
        paths:
          - path: /__/
            pathType: Prefix
            backend:
              service:
                name: firebase-auth
                port:
                  number: 443
