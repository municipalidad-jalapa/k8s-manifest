# SCRUM-309 (HU-137) AC4: el stream de posiciones sigue funcionando sobre
# TLS, sin cortes ni buffering. Mismo patron que production (SCRUM-149).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-sse-ingress
  namespace: qa
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Sin anotacion de cert-manager a proposito: reutiliza el mismo Secret
    # ecoruta-qa-tls que emite app-buses-ingress. Si los dos Ingress pidieran
    # el certificado, cert-manager crearia dos Certificate para el mismo
    # Secret y competirian entre si.
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ecoruta-qa.westus2.cloudapp.azure.com
      secretName: ecoruta-qa-tls
  rules:
    - host: ecoruta-qa.westus2.cloudapp.azure.com
      http:
        paths:
          - path: /api/v1/telemetria/stream
            pathType: Exact
            backend:
              service:
                name: backend-api-buses
                port:
                  number: 80
