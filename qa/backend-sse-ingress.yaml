# SCRUM-309 (HU-137) AC4: el stream de posiciones sigue funcionando sobre
# TLS, sin cortes ni buffering. Mismo patron que production (SCRUM-149).
# Sin tls: ni cert-manager: QA se expone via Tailscale Funnel, que termina
# el HTTPS en su propio borde (ver qa/tailscale-funnel.yaml y
# qa/backend-ingress.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-sse-ingress
  namespace: qa
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: ecoruta-qa.tail47a5f7.ts.net
      http:
        paths:
          - path: /api/v1/telemetria/stream
            pathType: Exact
            backend:
              service:
                name: backend-api-buses
                port:
                  number: 80
