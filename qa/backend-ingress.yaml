apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-api-buses
  namespace: qa
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend-api-buses
                port:
                  number: 80