apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-buses-ingress
  namespace: qa
  annotations:
    # SCRUM-309 (HU-137): cert-manager emite y renueva el certificado solo.
    # ingress-nginx redirige HTTP -> HTTPS automaticamente en cuanto hay
    # una seccion tls: en el Ingress, sin necesidad de otra anotacion.
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ecoruta-qa.westus2.cloudapp.azure.com
      secretName: ecoruta-qa-tls
  rules:
    - host: ecoruta-qa.westus2.cloudapp.azure.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-api-buses
                port:
                  number: 80
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: backend-api-buses
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-app-buses
                port:
                  number: 80
