apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-buses-ingress
  namespace: qa
  # SCRUM-309 (HU-137): sin tls: ni anotacion de cert-manager a proposito.
  # QA se expone via Tailscale Funnel (ver qa/tailscale-funnel.yaml), que
  # termina el HTTPS en su propio borde y le habla a este Ingress en HTTP
  # simple. cert-manager/Let's Encrypt via IP publica de Azure se descarto
  # (ver docs/https-qa.md): la cuota de IPs esta agotada y la unica IP
  # compartida disponible quedo en un estado que no se pudo reparar.
spec:
  ingressClassName: nginx
  rules:
    - host: ecoruta-qa.tail47a5f7.ts.net
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-api-buses
                port:
                  number: 80
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: backend-api-buses
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-app-buses
                port:
                  number: 80
