# Ingress del dominio propio de PRODUCCION: mibusjalapa.lat (apex).
#
# El apex mibusjalapa.lat es para produccion (rama main); el subdominio qa.*
# es para QA. Front y API salen por el MISMO host, asi no hay CORS. El DNS
# apunta mibusjalapa.lat -> IP publica del ingress-nginx de aks-buses-prod
# (20.83.88.147). El TLS lo emite Let's Encrypt via cert-manager
# (ver letsencrypt-issuer.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dominio-propio-prod
  namespace: production
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mibusjalapa.lat
      secretName: mibusjalapa-tls
  rules:
    - host: mibusjalapa.lat
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-api-buses
                port:
                  number: 80
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: backend-api-buses
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-app-buses
                port:
                  number: 80
---
# Stream SSE (posiciones en vivo) en su propio ingress para poder desactivar el
# buffering de nginx, igual que el backend-sse-ingress y el QA.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dominio-propio-prod-sse
  namespace: production
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mibusjalapa.lat
      secretName: mibusjalapa-tls
  rules:
    - host: mibusjalapa.lat
      http:
        paths:
          - path: /api/v1/telemetria/stream
            pathType: Exact
            backend:
              service:
                name: backend-api-buses
                port:
                  number: 80
