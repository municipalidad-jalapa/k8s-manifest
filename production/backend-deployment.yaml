apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api-buses
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-api-buses
  template:
    metadata:
      labels:
        app: backend-api-buses
    spec:
      containers:
        - name: backend-api-buses
          image: acrbusesjalapa.azurecr.io/backend-api-buses:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: production
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: ecoruta
            - name: DB_USER
              value: ecoruta
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: JWT_SECRET
            # SCRUM-310 (HU-138): credenciales del Admin SDK de Firebase. Los
            # nombres coinciden con ecoruta.firebase.credentials-json /
            # project-id (application.yml) para que el modulo de identidad
            # (SCRUM-158/HU-63, todavia sin mergear) funcione sin cambios
            # cuando se apruebe.
            - name: FIREBASE_CREDENTIALS_JSON
              valueFrom:
                secretKeyRef:
                  name: firebase-secret
                  key: FIREBASE_CREDENTIALS_JSON
            - name: FIREBASE_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: firebase-secret
                  key: FIREBASE_PROJECT_ID
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api-buses
  namespace: production
spec:
  selector:
    app: backend-api-buses
  ports:
    - port: 80
      targetPort: 8080