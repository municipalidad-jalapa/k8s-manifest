apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup
  namespace: production
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: managed-csi
  resources:
    requests:
      storage: 4Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: production
spec:
  # 03:00 UTC = 21:00 hora de Guatemala, fuera del horario de operación
  schedule: "0 3 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-backup
              image: postgis/postgis:16-3.4
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: db-secrets
                      key: DB_PASSWORD
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  ARCHIVO=/backup/ecoruta-$(date +%Y%m%d-%H%M).sql.gz
                  pg_dump -h postgres -U ecoruta -d ecoruta | gzip > "$ARCHIVO"
                  echo "Respaldo creado: $ARCHIVO"
                  # Retencion: conserva los ultimos 14 dias
                  find /backup -name 'ecoruta-*.sql.gz' -mtime +14 -delete
                  echo "Respaldos actuales:"
                  ls -lh /backup
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "500m"
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: postgres-backup