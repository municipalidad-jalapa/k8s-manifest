# ClusterIssuer de Let's Encrypt (produccion) para el apex mibusjalapa.lat.
# Mismo patron que QA (ver qa/letsencrypt-issuer.yaml). Requiere cert-manager
# instalado en el cluster (release oficial v1.21.1, igual que QA).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: evantejadaduarte@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
