# Traccar en PRODUCCION — recibe el rastreador Coban TK103A (protocolo gps103).
#
# Antes vivia solo en QA. Se movio a produccion para el piloto: el GPS reporta
# a prod y QA recibe una copia por el reenviador (traccar-reenviador.yaml)
# mientras ambos clusteres esten encendidos. El GPS no se reconfigura: sigue
# apuntando a la misma IP fija 20.114.56.168, puerto 5001.
# ---------- Configuracion ----------
# Extiende la config por defecto de Traccar (todos los protocolos, gps103 en
# 5001). registerUnknown sigue activo para que el equipo se de de alta solo en
# esta base nueva; apagarlo cuando la flota este registrada (deuda P2).
apiVersion: v1
kind: ConfigMap
metadata:
  name: traccar-config
  namespace: production
data:
  traccar.xml: |
    <?xml version='1.0' encoding='UTF-8'?>
    <!DOCTYPE properties SYSTEM 'http://java.sun.com/dtd/properties.dtd'>
    <properties>
      <entry key='config.default'>./conf/default.xml</entry>
      <entry key='database.driver'>org.h2.Driver</entry>
      <entry key='database.url'>jdbc:h2:./data/database</entry>
      <entry key='database.user'>sa</entry>
      <entry key='database.password'></entry>
      <entry key='database.registerUnknown'>true</entry>
      <!-- SCRUM-24: reenvio de posiciones. Va al reenviador, que lo entrega
           al backend de produccion y manda una copia a QA. El token NO se
           versiona: desplegar-produccion.yml sustituye ${TRACCAR_TOKEN} con
           envsubst antes de aplicar este manifiesto. -->
      <entry key='forward.enable'>true</entry>
      <entry key='forward.url'>http://traccar-reenviador.production.svc.cluster.local/posiciones</entry>
      <entry key='forward.header'>X-Traccar-Token: ${TRACCAR_TOKEN}</entry>
      <entry key='forward.type'>json</entry>
    </properties>
---
# ---------- Almacenamiento persistente ----------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: traccar-data
  namespace: production
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: managed-csi
  resources:
    requests:
      storage: 2Gi
---
# ---------- Traccar ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traccar
  namespace: production
spec:
  replicas: 1
  # Un solo pod sobre un volumen ReadWriteOnce: hay que apagar el viejo antes
  # de montar el nuevo.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: traccar
  template:
    metadata:
      labels:
        app: traccar
    spec:
      containers:
        - name: traccar
          # Version fija (la validada en QA). Actualizar a proposito.
          image: traccar/traccar:6.15.3
          ports:
            - containerPort: 8082
              name: web
            - containerPort: 5001
              name: gps103
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /opt/traccar/data
            - name: config
              mountPath: /opt/traccar/conf/traccar.xml
              subPath: traccar.xml
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /
              port: 8082
            initialDelaySeconds: 40
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: traccar-data
        - name: config
          configMap:
            name: traccar-config
---
# ---------- Exposicion ----------
# La IP fija 20.114.56.168 (pip-traccar-gps) vive en el grupo rg-buses-jalapa,
# no en el grupo de nodos de un cluster: asi no se pierde si se recrea un
# cluster. El cluster de produccion tiene rol Network Contributor sobre ese
# grupo para poder usarla. DNS: gps.mibusjalapa.lat.
apiVersion: v1
kind: Service
metadata:
  name: traccar
  namespace: production
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-resource-group: "rg-buses-jalapa"
    service.beta.kubernetes.io/azure-load-balancer-ipv4: "20.114.56.168"
spec:
  type: LoadBalancer
  selector:
    app: traccar
  ports:
    - name: web
      port: 8082
      targetPort: 8082
      protocol: TCP
    - name: gps103
      port: 5001
      targetPort: 5001
      protocol: TCP
